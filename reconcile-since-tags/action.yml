name: Reconcile @since tags
description: >-
  Reconcile Javadoc @since tags against a library's published release history.
  Builds a "signature -> earliest continuous release" index from the -sources.jar
  artifacts on Maven Central, then fills missing tags, fixes wrong ones, creates
  minimal @since javadoc for undocumented types, and removes redundant tags.
  Leaves the working tree modified for the caller to commit / open a PR.

inputs:
  group-id:
    description: Maven groupId of the published artifacts (e.g. com.vaadin)
    required: true
  artifacts:
    description: |
      Newline-separated list of published modules, one per line. Each entry is
      either just the artifact id (source root defaults to <artifact>/src/main/java)
      or "<artifact>=<source-root>" when the layout differs, e.g.
        flow-server
        flow-data
        my-addon=addons/my-addon/src/main/java
    required: true
  version:
    description: Target version (blank = derive major.minor from the pom's project.version)
    required: false
    default: ""
  formatter:
    description: "auto | spotless | formatter | none — how to reformat touched files"
    required: false
    default: auto
  filter:
    description: "all | add | update — which changes to apply"
    required: false
    default: all
  write:
    description: "true to modify files; false for a dry run (reports only)"
    required: false
    default: "true"
  index-dir:
    description: >-
      Where the built index is stored/cached. Give artifacts with an independent
      version timeline (e.g. add-ons versioned separately from the core) their own
      index-dir and a separate invocation, so their versions don't pollute the
      shared axis.
    required: false
    default: .since-index

outputs:
  version:
    description: The resolved target version
    value: ${{ steps.ver.outputs.dev }}

runs:
  using: composite
  steps:
    - name: Install jbang
      shell: bash
      run: |
        curl -Ls https://sh.jbang.dev | bash -s - app setup
        echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"

    # Cache keys: sources depend only on the published versions; the parsed index
    # also depends on the tool. A new release changes META; a tool change changes TOOL.
    # ARTS scopes the source cache to this invocation's artifact list: several
    # invocations (matrix shards of one artifact each, or a separately-versioned
    # module with its own index-dir) run against the same repository cache, and an
    # unscoped restore-key prefix would hand each of them some other invocation's
    # sources -- a useless restore that is then saved back on top of its own, so
    # every entry grows by every other artifact's history run after run.
    - name: Compute cache keys
      id: keys
      shell: bash
      run: |
        set -euo pipefail
        g=$(echo "${{ inputs.group-id }}" | tr . /)
        arts=$(echo "${{ inputs.artifacts }}" | sed 's/=.*//; s/#.*//' | tr -d '[:blank:]' | grep -v '^$')
        ARTS=$(echo "$g $arts" | sha256sum | cut -c1-12)
        echo "arts=$ARTS" >> "$GITHUB_OUTPUT"
        # A silently-failed metadata fetch would hash an empty/error body into the
        # cache key, so retry, and collect the bodies in a file instead of piping
        # the loop straight into sha256sum: a pipeline reports only its last
        # command's status, so a fetch that kept failing for any artifact but the
        # last used to key the cache -- and the index stored under it -- on a
        # partial set, a key that then stops changing when that artifact releases.
        meta="$RUNNER_TEMP/since-metadata"
        : > "$meta"
        for a in $arts; do
          curl -sS --fail --max-time 60 --retry 4 --retry-delay 2 \
            --retry-all-errors --retry-connrefused \
            "https://repo1.maven.org/maven2/$g/$a/maven-metadata.xml" >> "$meta"
        done
        META=$(sha256sum "$meta" | cut -c1-16)
        TOOL=$(sha256sum "$GITHUB_ACTION_PATH/SinceTool.java" | cut -c1-16)
        echo "meta=$META" >> "$GITHUB_OUTPUT"
        echo "tool=$TOOL" >> "$GITHUB_OUTPUT"

    - name: Restore extracted sources
      id: srccache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/since-tags
        key: since-tags-src-${{ steps.keys.outputs.arts }}-${{ steps.keys.outputs.meta }}
        restore-keys: since-tags-src-${{ steps.keys.outputs.arts }}-

    - name: Cache built index
      id: idxcache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.index-dir }}
        key: since-tags-idx-${{ steps.keys.outputs.tool }}-${{ steps.keys.outputs.meta }}

    - name: Determine target version
      id: ver
      shell: bash
      run: |
        DEV="${{ inputs.version }}"
        if [ -z "$DEV" ]; then
          MVN="mvn"; [ -x ./mvnw ] && MVN=./mvnw
          V=$($MVN -q help:evaluate -Dexpression=project.version -DforceStdout)
          DEV=$(echo "$V" | sed 's/-SNAPSHOT//' | awk -F. '{print $1"."$2}')
        fi
        echo "dev=$DEV" >> "$GITHUB_OUTPUT"
        echo "Target version: $DEV"

    - name: Reconcile @since
      id: reconcile
      shell: bash
      env:
        GROUP: ${{ inputs.group-id }}
        ARTIFACTS: ${{ inputs.artifacts }}
        DEV: ${{ steps.ver.outputs.dev }}
        FORMATTER: ${{ inputs.formatter }}
        FILTER: ${{ inputs.filter }}
        WRITE: ${{ inputs.write }}
        INDEX_DIR: ${{ inputs.index-dir }}
        SKIP_INDEX: ${{ steps.idxcache.outputs.cache-hit == 'true' && '1' || '0' }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"

    # Only worth saving when sources were actually downloaded: on an index-cache hit
    # nothing is fetched, and storing that (near-empty) directory would make it the
    # newest match for the restore-key prefix and force a full re-download next time.
    - name: Save extracted sources
      if: steps.srccache.outputs.cache-hit != 'true' && steps.idxcache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/since-tags
        key: since-tags-src-${{ steps.keys.outputs.arts }}-${{ steps.keys.outputs.meta }}

    # A release that cannot be fetched aborts the index build, so a failed run is
    # usually one that downloaded most of a long history and then lost a request:
    # keep what it got, or a re-run over a flaky network starts from zero every
    # time and never converges. The partial state is stored under its own key so
    # it is only ever found through the restore-key prefix -- an exact hit has to
    # keep meaning "complete", otherwise the next run hits it, downloads the rest
    # and finds its own key already taken with nothing to save the remainder under.
    - name: Save partially extracted sources
      if: ${{ !cancelled() && steps.reconcile.outcome == 'failure' && steps.idxcache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/since-tags
        key: since-tags-src-${{ steps.keys.outputs.arts }}-${{ steps.keys.outputs.meta }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Job summary
      shell: bash
      run: |
        {
          echo "### @since reconciliation (version ${{ steps.ver.outputs.dev }})"
          echo '```'
          git diff --shortstat -- '*.java' || true
          grep -hE '^(correct|fixed|filled|new in dev|removed|created javadoc|no javadoc)' "${{ inputs.index-dir }}"/report-*.md 2>/dev/null \
            | awk -F: '{gsub(/[^0-9]/,"",$2); a[$1]+=$2} END{for(k in a) printf "%-26s %d\n", k, a[k]}' || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
