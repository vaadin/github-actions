name: 'Claude PR Presentation'
description: >-
  Explains a pull request as a slide deck built from its code by one headless
  Claude Code session, and links the deck from one comment on the PR.

inputs:
  anthropic-api-key:
    description: >-
      Anthropic API key. Pass the repository secret, e.g.
      secrets.ANTHROPIC_API_KEY.
    required: true
  pr-number:
    description: >-
      Number of the pull request to present, computed by the caller from the
      triggering event (e.g. github.event.issue.number ||
      github.event.pull_request.number).
    required: true
  github-token:
    description: >-
      Read-only token that the Claude session uses to collect the PR (pull
      request metadata, linked issues). Keep the job's permissions at
      contents read and pull-requests read so the default token is read-only.
    required: false
    default: ${{ github.token }}
  comment-token:
    description: >-
      Token used only to post or update the PR comment; its identity is the
      comment author. Needs pull-requests write. Pass a bot token or a
      GitHub App installation token.
    required: true

runs:
  using: composite
  steps:
    # The skill computes the merge base in the checkout.
    - name: Check checkout
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::Check out the repository with fetch-depth: 0"
          exit 1
        fi

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code@2.1.311

    - name: Run Claude Code presentation
      id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/run-presentation.mjs" "${{ inputs.pr-number }}"

    # archive: false stores the file as it is, so the artifact URL opens the
    # deck in the browser. The artifact then takes the file's name (the name
    # input is ignored); overwrite covers a re-run of the same workflow run.
    - name: Upload deck
      id: deck
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.run.outputs.deck-file }}
        archive: false
        overwrite: true

    - name: Post comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.comment-token }}
        ARTIFACT_URL: ${{ steps.deck.outputs.artifact-url }}
      run: node "$GITHUB_ACTION_PATH/post-comment.mjs" "${{ inputs.pr-number }}"

    - name: Summarize Claude session
      if: always() && steps.run.outputs.execution-file != ''
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../lib/claude-summary.mjs" "${{ steps.run.outputs.execution-file }}"
