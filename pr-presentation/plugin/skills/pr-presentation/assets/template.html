<style>
/* Layout: reveal.js deck on a 1440x810 canvas. A title slide, then one slide per idea (left/right), each
   a heading line and a before | after pair of code panes; all slides are horizontal.
   A deliberate single light look. */
:root {
  --bg: #ffffff;
  --fg: #1b1f27;
  --muted: #6b7280;
  --line: #e5e7eb;
  --accent: #2c5fd6;
  --before-bg: #fdf3f3;
  --after-bg: #f1faf3;
  --ctx-bg: #f5f6f8;
  --tip-bg: rgba(44, 95, 214, .08);
  --note-bg: #fff4e0;
  --note-line: #e08a1e;
  --note-ink: #9a5200;
  --bug-bg: #fdeceb;
  --bug-line: #d93a32;
  --bug-ink: #a8231c;
  --tok-kw: #8a3fb8;
  --tok-type: #1f6f8b;
  --tok-str: #8a5a00;
  --tok-com: #6f7785;
  --tok-ann: #a2470f;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-code: "Fira Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-background-color: var(--bg);
  --r-main-font: var(--font-ui);
  --r-main-color: var(--fg);
  --r-main-font-size: 26px;
  --r-heading-font: var(--font-ui);
  --r-heading-color: var(--fg);
  --r-heading-text-transform: none;
  --r-heading-font-weight: 600;
  --r-heading-letter-spacing: 0;
  --r-link-color: var(--accent);
  --r-progress-color: var(--accent);
  color-scheme: light;
}
html, body { background: var(--bg); color: var(--fg); height: 100%; }
* { font-variant-ligatures: none; }
.reveal .slides { text-align: left; }
.reveal .slides section { height: 100%; }
.reveal h1 { font-size: 60px; line-height: 1.2; text-wrap: balance; margin: 0 0 24px; }
.reveal h2 { font-size: 30px; line-height: 1.25; margin: 0; }
.reveal p { margin: 0; }
.reveal .slide-number { background: transparent; color: var(--muted); font: 13px var(--font-ui); }

.title-slide { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; }
.title-slide .meta { color: var(--muted); font-size: 18px; margin-bottom: 18px; }
.title-slide .meta a { color: inherit; }
.title-slide .lead { font-size: 19px; line-height: 1.55; color: var(--muted); max-width: 40em; }

.concept { height: 100%; display: flex; flex-direction: column; gap: 18px; }
.concept .lead { font-size: 21px; line-height: 1.5; color: var(--muted); max-width: 60em; }
.concept .head { display: flex; align-items: baseline; gap: 16px; }
.steps { display: flex; flex-direction: column; gap: 4px; max-width: 1100px; }
.step-row { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; }
.step-num { width: 30px; height: 30px; border-radius: 50%; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.step-content { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.step-text { font-size: 19px; line-height: 1.45; }
.side.step { background: var(--before-bg); padding: 12px 16px; gap: 6px; }
.side.step .label { text-transform: none; letter-spacing: 0; font-family: var(--font-code); font-size: 13px; }
.step-arrow { color: var(--muted); font-size: 20px; line-height: 1; padding-left: 7px; }
/* Closing slide: the open questions by kind, each with a link to the slide that holds its tip */
.notes { display: flex; flex-direction: column; gap: 20px; max-width: 1100px; }
.note-group { display: flex; flex-direction: column; gap: 8px; }
.note-kind { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.note-kind small { text-transform: none; letter-spacing: 0; font-size: 14px; margin-left: 10px; }
.note { font-size: 19px; line-height: 1.45; display: flex; gap: 12px; align-items: baseline; }
.note .q { font-family: var(--font-code); font-size: 13px; color: var(--muted); flex-shrink: 0; }
.note .text { flex: 1; min-width: 0; }
.note a { font-size: 14px; color: var(--accent); white-space: nowrap; text-decoration: none; }
.note a:hover, .note a:focus-visible { text-decoration: underline; }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; flex-shrink: 0; }
.sides.single { grid-template-columns: 1fr; }
.side { border-radius: 10px; padding: 16px 18px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
.side.before { background: var(--before-bg); }
.side.after { background: var(--after-bg); }
/* Context is supporting code: smaller and quieter than the changed code above it */
.side.ctx { background: var(--ctx-bg); padding: 12px 16px; gap: 10px; }
.side.ctx .chunk .lines, .side.ctx .chunk.recap .lines { font-size: 13.5px; opacity: .8; }
.sides.only-ctx .side.ctx .chunk .lines { font-size: 15.5px; opacity: 1; }
.side .label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chunk .cap { font-size: 14px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
.chunk.recap .lines { opacity: .65; }
.chunk .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chunk .lines { font-variant-ligatures: normal; font-family: var(--font-code); font-size: 15.5px; line-height: 1.5; }
/* A long line wraps only where breakLines allows it, and its next rows are indented two levels deeper */
.chunk .ln { white-space: pre-wrap; overflow-wrap: break-word; min-height: 1.55em; padding-left: 4ch; text-indent: -4ch; }
.gap { color: var(--muted); opacity: .5; }
.chunk .ln.blank { min-height: .8em; }
.chunk .ln.del { background: rgba(207, 34, 46, .13); }
.chunk .ln.add { background: rgba(26, 127, 55, .15); }
/* The changed words of a partly changed line; a line that changed as a whole has only the line color */
.chunk .ln.del .chg { background: rgba(207, 34, 46, .26); border-radius: 3px; }
.chunk .ln.add .chg { background: rgba(26, 127, 55, .28); border-radius: 3px; }
.chunk .cap .file { font-family: var(--font-code); font-size: 12.5px; color: var(--muted); }
.chunk .ln.pad { background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(0, 0, 0, .04) 6px 7px); }
.chunk .src { margin-left: 10px; color: var(--muted); opacity: .45; text-decoration: none; font-family: var(--font-ui); font-size: 13px; }
.chunk .src:hover, .chunk .src:focus-visible { opacity: 1; color: var(--accent); }

.tip { text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; cursor: help; border-radius: 3px; }
.tip:hover, .tip:focus-visible, .tip.open { background: var(--tip-bg); outline: none; }
#tooltip {
  position: fixed; z-index: 50; max-width: min(360px, calc(100vw - 32px)); pointer-events: none;
  background: var(--fg); color: var(--bg); font: 15px/1.45 var(--font-ui); padding: 8px 12px; border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .12), 0 10px 28px rgba(0, 0, 0, .28); --flag-line: var(--fg); --flag-bg: var(--fg);
}
/* Review notes (open questions): a wavy underline on the code, red for a suspected bug and orange for the
   other kinds, and a tooltip in the same color. Every tooltip has an arrow that points at its code */
.tip.flag { text-decoration: underline wavy var(--flag-line); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.tip.flag:hover, .tip.flag:focus-visible, .tip.flag.open { background: var(--flag-bg); }
.flag.bug { --flag-line: var(--bug-line); --flag-bg: var(--bug-bg); }
.flag.open-q { --flag-line: var(--note-line); --flag-bg: var(--note-bg); }
#tooltip.flagged { color: var(--fg); background: var(--flag-bg); border: 1px solid var(--flag-line); }
#tooltip.flagged b { font-weight: 600; color: var(--flag-ink); }
#tooltip.flagged.bug { --flag-line: var(--bug-line); --flag-bg: var(--bug-bg); --flag-ink: var(--bug-ink); }
#tooltip.flagged.open-q { --flag-line: var(--note-line); --flag-bg: var(--note-bg); --flag-ink: var(--note-ink); }
#tooltip::before, #tooltip::after { content: ""; position: absolute; left: var(--arrow-x, 18px); border: 7px solid transparent; transform: translateX(-50%); }
#tooltip::before { bottom: 100%; border-bottom-color: var(--flag-line); }
#tooltip::after { bottom: calc(100% - 1.5px); border-bottom-color: var(--flag-bg); }
#tooltip.up::before { bottom: auto; top: 100%; border-bottom-color: transparent; border-top-color: var(--flag-line); }
#tooltip.up::after { bottom: auto; top: calc(100% - 1.5px); border-bottom-color: transparent; border-top-color: var(--flag-bg); }
.lead code, #tooltip code { font-family: var(--font-code); font-size: .88em; white-space: nowrap; }
.lead code { color: var(--fg); }
.t-kw { color: var(--tok-kw); } .t-ty { color: var(--tok-type); } .t-st { color: var(--tok-str); }
.t-co { color: var(--tok-com); font-style: italic; } .t-an { color: var(--tok-ann); }

/* Ask Claude: a chat per slide in a side panel, shown only where the viewer can reach Claude */
#ask-btn {
  position: fixed; left: 16px; bottom: 14px; z-index: 40; font: 500 14px var(--font-ui); color: var(--accent);
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
#ask-btn:hover, #ask-btn:focus-visible { border-color: var(--accent); outline: none; }
#ask {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(440px, 100vw); display: flex; flex-direction: column;
  background: var(--bg); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 0, 0, .08); font: 15px/1.5 var(--font-ui);
}
#ask[hidden] { display: none; }
/* The deck makes room for the panel on wide screens; on narrow ones the panel covers it */
@media (min-width: 900px) { body.asking .reveal { width: calc(100% - 440px) !important; } body.asking #ask-btn { display: none; } }
#ask header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
#ask header .t { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ask header .t small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
#ask button { font: 500 13px var(--font-ui); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
#ask button:hover, #ask button:focus-visible { border-color: var(--accent); outline: none; }
#ask .log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
#ask .empty { color: var(--muted); }
#ask .msg { overflow-wrap: anywhere; }
#ask .msg.user { align-self: flex-end; max-width: 85%; background: var(--tip-bg); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; }
#ask .msg.claude p, #ask .msg.claude ul, #ask .msg.claude ol, #ask .msg.claude pre { margin: 0 0 8px; }
#ask .msg.claude ul, #ask .msg.claude ol { padding-left: 20px; }
#ask .msg.claude pre { background: var(--ctx-bg); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font: 13px/1.45 var(--font-code); }
#ask .msg code { font-family: var(--font-code); font-size: .88em; }
#ask .msg.note { color: var(--muted); font-size: 13px; }
#ask form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
#ask textarea { flex: 1; resize: none; font: 15px/1.4 var(--font-ui); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 42px; max-height: 160px; }
#ask textarea:focus { outline: none; border-color: var(--accent); }

        (slide.steps || []).forEach(function (step, i) {
          lines.push('', 'Step ' + (i + 1) + (step.where ? ' (in ' + step.where + ')' : '') + ': ' + step.text, '```\n' + step.code + '\n```');
        });
        ['before', 'after'].forEach(function (side) {
          var chunks = chunkList(slide[side]);
          if (!chunks.length) return;
          lines.push('', (slide[side + 'Label'] || side) + ' code on this slide:');
          chunks.forEach(function (c) {
            lines.push((c.context ? '(unchanged context)\n' : '') + '```\n' + c.code + '\n```');
          });
        });
      } else if (sc.notes) {
        lines.push('', 'The reader is on the closing slide, which lists the open questions by kind:');
        (data.open || []).forEach(function (o) { lines.push('- ' + o.kind + ' (' + (o.questions || []).join(', ') + '): ' + o.text); });
      } else {
        lines.push('', 'The reader is on the title slide.');
      }
      return lines.join('\n');
    }
    function md(text) {
      var out = [], list = null;
      function flush() { if (list) { out.push('</' + list + '>'); list = null; } }
      text.split(/(```[^\n]*\n[\s\S]*?(?:```|$))/).forEach(function (block) {
        var fence = /^```[^\n]*\n([\s\S]*?)(?:```)?$/.exec(block);
        if (fence) { flush(); out.push('<pre><code>' + esc(fence[1].replace(/\n$/, '')) + '</code></pre>'); return; }
        block.split('\n').forEach(function (line) {
          var inline = function (t) { return prose(t).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); };
          var m = /^\s*(?:([-*])|(\d+)\.)\s+(.*)$/.exec(line);
          if (m) {
            var tag = m[1] ? 'ul' : 'ol';
            if (list !== tag) { flush(); out.push('<' + tag + '>'); list = tag; }
            out.push('<li>' + inline(m[3]) + '</li>');
          } else if (line.trim()) { flush(); out.push('<p>' + inline(line.replace(/^#+\s*/, '')) + '</p>'); }
          else flush();
        });
      });
      flush();
      return out.join('');
    }
    function bubble(cls, html) { var b = el('div', 'msg ' + cls); b.innerHTML = html; log.appendChild(b); log.scrollTop = log.scrollHeight; return b; }
    function render() {
      var w = where(), sc = screenOf(w);
      key = String(w.h);
      title.innerHTML = esc(sc.title);
      log.textContent = '';
      var turns = chats[key] || [];
      if (!turns.length) log.appendChild(el('div', 'empty', 'Ask anything about this slide: why a line changed, what a name does, what could break.'));
      turns.forEach(function (t) { bubble(t.role === 'user' ? 'user' : 'claude', t.role === 'user' ? esc(t.content) : md(t.content)); });
    }
    function stop() { if (ctl) ctl.abort(); }
    function busy(on) { send.textContent = on ? 'Stop' : 'Send'; box.disabled = on; }
    function show(on) { panel.hidden = !on; document.body.classList.toggle('asking', on); Reveal.layout(); }
    function open() { show(true); render(); box.focus(); }
    function shut() { stop(); show(false); btn.focus(); }
    function hideAll() { stop(); show(false); btn.remove(); panel.remove(); }
    var FAIL = {
      rate_limited: 'Too many requests for now. Try again in a little while.',
      session_expired: 'Your session expired. Sign in again, then retry.',
      refused: 'Claude declined this question. Try asking it differently.',
      prompt_too_large: 'This chat got too long. Start a new chat.',
      empty_completion: 'Claude gave no answer. Try rephrasing the question.'
    };
    var GONE = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (ctl) { stop(); return; }
      var q = box.value.trim();
      if (!q) return;
      var k = key, turns = chats[k] = chats[k] || [];
      if (!turns.length) log.textContent = '';
      turns.push({ role: 'user', content: q });
      bubble('user', esc(q));
      box.value = '';
      var reply = bubble('claude', '<p class="empty">Thinking…</p>'), mine = ctl = new AbortController();
      busy(true);
      sample([{ role: 'user', content: context(where()) }].concat(turns), {
        cache: false, signal: mine.signal,
        onText: function (u) { reply.innerHTML = md(u.text); log.scrollTop = log.scrollHeight; }
      }).then(function (r) {
        turns.push({ role: 'assistant', content: r.text });
        if (r.truncated) bubble('note', 'The answer was cut short. Ask for less at a time.');
      }, function (err) {
        if (GONE.indexOf(err.code) >= 0) { hideAll(); return; }
        if (err.text) turns.push({ role: 'assistant', content: err.text });
        if (err.code === 'refused' || !err.text) reply.remove(); else reply.innerHTML = md(err.text);
        if (err.code !== 'cancelled') bubble('note', esc(FAIL[err.code] || 'Something went wrong. Try again.'));
      }).then(function () { if (ctl === mine) ctl = null; busy(false); box.focus(); });
    });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
      if (e.key === 'Escape') shut();
    });
    btn.addEventListener('click', function () { if (panel.hidden) open(); else shut(); });
    close.addEventListener('click', shut);
    fresh.addEventListener('click', function () { stop(); delete chats[key]; render(); box.focus(); });
    Reveal.on('slidechanged', function () { if (!panel.hidden) { stop(); render(); } });
  });})();
</script>
