<style>
/* Layout: Shower deck on a 1440x810 canvas. A title slide, then one slide per idea, each a heading
   line and a before | after pair of code panes. A deliberate single light look. */
:root {
  --bg: #ffffff;
  --fg: #1b1f27;
  --muted: #6b7280;
  --accent: #2c5fd6;
  --before-bg: #fdf3f3;
  --after-bg: #f1faf3;
  --ctx-bg: #f5f6f8;
  /* Pane tags */
  --before-tag: #f6d5d7;
  --before-tag-ink: #a1252f;
  --after-tag: #cfe9d6;
  --after-tag-ink: #17642d;
  --ctx-tag: #e3e6eb;
  --ctx-tag-ink: #4b5563;
  /* Removed and added lines, and their changed words */
  --del-bg: rgba(207, 34, 46, .13);
  --del-chg: rgba(207, 34, 46, .26);
  --add-bg: rgba(26, 127, 55, .15);
  --add-chg: rgba(26, 127, 55, .28);
  /* Inline code in titles and prose */
  --code-bg: #e9ecf2;
  --tip-bg: rgba(44, 95, 214, .08);
  --note-bg: #fff4e0;
  --note-line: #e08a1e;
  --note-ink: #9a5200;
  --bug-bg: #fdeceb;
  --bug-line: #d93a32;
  --bug-ink: #a8231c;
  --tok-kw: #8a3fb8;
  --tok-type: #1f6f8b;
  --tok-str: #8a5a00;
  --tok-com: #6f7785;
  --tok-ann: #a2470f;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-code: "Fira Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* Font sizes, all multiples of 2 */
  --fs-h1: 60px;
  --fs-h2: 30px;
  --fs-base: 26px;
  --fs-text: 20px;
  --fs-meta: 18px;
  --fs-code: 16px;
  --fs-small: 14px;
  --fs-tiny: 12px;
  /* The 1440x810 canvas plus a 4% margin */
  --slide-w: 1498px;
  --slide-h: 842px;
  color-scheme: light;
}
html, body { background: var(--bg); color: var(--fg); height: 100%; margin: 0; }
* { font-variant-ligatures: none; }

/* Shower: full mode scales the active slide to the window; list mode (Esc) shows all slides in a grid,
   and a click on one opens it in full mode again */
#slides { display: contents; }
.slide {
  position: relative; box-sizing: border-box; width: var(--slide-w); height: var(--slide-h); padding: 16px 29px;
  overflow: hidden; background: var(--bg); font: var(--fs-base)/1.3 var(--font-ui);
}
.shower.full { overflow: hidden; }
.shower.full .slide {
  position: fixed; top: 50%; left: 50%; visibility: hidden; opacity: 0; transition: opacity .2s, visibility .2s;
  transform: translate(-50%, -50%) scale(min(tan(atan2(100vw, var(--slide-w))), tan(atan2(100vh, var(--slide-h)))));
}
.shower.full .slide.active { visibility: visible; opacity: 1; }
.shower.list {
  --cols: 2; --gap: 24px; --s: calc(tan(atan2(100vw - (var(--cols) + 1) * var(--gap), var(--slide-w))) / var(--cols));
  height: auto; display: grid; gap: var(--gap); padding: var(--gap); overflow-x: hidden; background: var(--ctx-bg);
  grid-template-columns: repeat(var(--cols), calc(var(--slide-w) * var(--s))); grid-auto-rows: calc(var(--slide-h) * var(--s));
}
@media (width >= 1200px) { .shower.list { --cols: 3; } }
.shower.list .slide { transform: scale(var(--s)); transform-origin: 0 0; border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, .12); cursor: pointer; }
.shower.list .slide * { pointer-events: none; }
.shower.list .slide.active { outline: 8px solid var(--accent); }
.progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width .2s; }
.slide-number { position: fixed; right: 16px; bottom: 10px; color: var(--muted); font: var(--fs-small) var(--font-ui); }
.shower.list .progress, .shower.list .slide-number { display: none; }
/* Shower's live region for screen readers */
.region { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* Headings and prose */
.slide h1, .slide h2, b { font-weight: 600; }
.slide h1 { font-size: var(--fs-h1); line-height: 1.2; text-wrap: balance; margin: 0 0 24px; }
.slide h2 { font-size: var(--fs-h2); line-height: 1.25; margin: 0; }
.slide p { margin: 0; }
/* Prose: the slide sentence, the summary, step texts and review notes */
.lead, .step-text, .notes { font-size: var(--fs-text); line-height: 1.5; }
.lead { color: var(--muted); }
/* Code in titles and prose: a light chip, so names stand out from the text around them */
.slide h1 code, .slide h2 code, .lead code, .step-text code, .notes code {
  font-family: var(--font-code); font-size: .86em; white-space: nowrap; color: var(--fg);
  background: var(--code-bg); padding: .08em .36em; border-radius: 5px;
}

/* Title slide */
.title-slide { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; }
.title-slide .meta { color: var(--muted); font-size: var(--fs-meta); margin-bottom: 18px; }
.title-slide .meta a { color: inherit; }
.title-slide .lead { line-height: 1.55; max-width: 40em; }

/* Content slides: heading, one sentence, then the code */
.concept { height: 100%; display: flex; flex-direction: column; gap: 18px; }
.concept .head { display: flex; align-items: baseline; gap: 16px; }
.concept .lead { max-width: 60em; }

/* Bug slides: numbered steps, each a sentence and a few lines of old code */
.steps { display: flex; flex-direction: column; gap: 4px; max-width: 1100px; }
.step-row { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; }
.step-num {
  width: 30px; height: 30px; margin-top: 2px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--fg); color: var(--bg); font-weight: 600; font-size: var(--fs-code);
}
.step-content { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.step-arrow { color: var(--muted); font-size: var(--fs-text); line-height: 1; padding-left: 7px; }

/* Closing slide: the open questions as a list, each with a link to the slide that holds its tip */
.notes { display: flex; flex-direction: column; gap: 12px; max-width: 1100px; margin: 0; padding-left: 1.6em; }
.notes a { margin-left: 4px; font-size: var(--fs-small); color: var(--accent); white-space: nowrap; text-decoration: none; }
.notes a:hover, .notes a:focus-visible { text-decoration: underline; }

/* Code panes: before | after side by side, or one pane at full width */
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; flex-shrink: 0; }
.sides.single { grid-template-columns: 1fr; }
.side { position: relative; border-radius: 10px; padding: 16px 18px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
.side.before { background: var(--before-bg); }
.side.after { background: var(--after-bg); }
/* Context is supporting code: smaller and quieter than the changed code above it */
.side.ctx { background: var(--ctx-bg); padding: 12px 16px; gap: 10px; }
.side.ctx .chunk .lines { font-size: var(--fs-small); opacity: .8; }
.sides.only-ctx .side.ctx .chunk .lines { font-size: var(--fs-code); opacity: 1; }
/* The code of a step, with the name of its method as the label */
.side.step { background: var(--before-bg); padding: 12px 16px; gap: 6px; }
/* Code pane tags: pills at the right end of the first row (the file path row) that take no height. The pill
   is opaque, so a long first line runs under it instead of through it */
.side:not(.step) > .label {
  position: absolute; top: 15px; right: 18px; z-index: 1; padding: 2px 9px; border-radius: 999px;
  font-weight: 600; line-height: 16px;
}
.side.before > .label { background: var(--before-tag); color: var(--before-tag-ink); }
.side.after > .label { background: var(--after-tag); color: var(--after-tag-ink); }
.side.ctx > .label { top: 11px; right: 16px; background: var(--ctx-tag); color: var(--ctx-tag-ink); }

/* Chunks: a caption row (file path, caption, tag), then the lines */
.side > .chunk.new-file { margin-top: 16px; }
.chunk .cap { font-size: var(--fs-small); color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
/* Small labels: file paths and step methods in code; pane tags and the recap tag in uppercase */
.chunk .cap .file, .side.step > .label { font-family: var(--font-code); font-size: var(--fs-tiny); color: var(--muted); }
.side:not(.step) > .label, .chunk .tag { font-size: var(--fs-tiny); letter-spacing: .08em; text-transform: uppercase; }
.chunk .tag { color: var(--muted); }
.chunk .lines { font-variant-ligatures: normal; font-family: var(--font-code); font-size: var(--fs-code); line-height: 1.5; }
.chunk.recap .lines { opacity: .65; }
/* A long line wraps only where breakLines allows it, and its next rows are indented two levels deeper */
.chunk .ln { white-space: pre-wrap; overflow-wrap: break-word; min-height: 1.55em; padding-left: 4ch; text-indent: -4ch; }
.chunk .ln.blank { min-height: .8em; }
.chunk .ln.del { background: var(--del-bg); }
.chunk .ln.add { background: var(--add-bg); }
/* The changed words of a partly changed line; a line that changed as a whole has only the line color */
.chunk .ln .chg { border-radius: 3px; }
.chunk .ln.del .chg { background: var(--del-chg); }
.chunk .ln.add .chg { background: var(--add-chg); }
/* A row left empty so that the two sides stay level */
.chunk .ln.pad { background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(0, 0, 0, .04) 6px 7px); }
/* Skipped code ("...") */
.gap { color: var(--muted); opacity: .5; }
/* The link to the line on GitHub */
.chunk .src { margin-left: 10px; color: var(--muted); opacity: .45; text-decoration: none; font-family: var(--font-ui); font-size: var(--fs-small); }
.chunk .src:hover, .chunk .src:focus-visible { opacity: 1; color: var(--accent); }

/* Syntax highlighting */
.t-kw { color: var(--tok-kw); }
.t-ty { color: var(--tok-type); }
.t-st { color: var(--tok-str); }
.t-co { color: var(--tok-com); font-style: italic; }
.t-an { color: var(--tok-ann); }

/* Tips: a dotted underline on the code, and a dark tooltip on hover */
.tip { text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; border-radius: 3px; }
.tip:hover, .tip:focus-visible, .tip.open { background: var(--tip-bg); outline: none; }
/* Review notes (open questions): a wavy underline on the code, red for a suspected bug and orange for the
   other kinds, and a tooltip in the same color */
.tip.flag { text-decoration: underline wavy var(--flag-line); text-decoration-thickness: 1.5px; }
.tip.flag:hover, .tip.flag:focus-visible, .tip.flag.open { background: var(--flag-bg); }
.flag.bug, #tooltip.flagged.bug { --flag-line: var(--bug-line); --flag-bg: var(--bug-bg); --flag-ink: var(--bug-ink); }
.flag.open-q, #tooltip.flagged.open-q { --flag-line: var(--note-line); --flag-bg: var(--note-bg); --flag-ink: var(--note-ink); }
#tooltip {
  position: fixed; z-index: 50; max-width: min(360px, calc(100vw - 32px)); pointer-events: none;
  background: var(--fg); color: var(--bg); font: var(--fs-small)/1.45 var(--font-ui); padding: 8px 12px; border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .12), 0 10px 28px rgba(0, 0, 0, .28); --flag-line: var(--fg); --flag-bg: var(--fg);
}
#tooltip code { font-family: var(--font-code); font-size: .88em; white-space: nowrap; }
#tooltip.flagged { color: var(--fg); background: var(--flag-bg); border: 1px solid var(--flag-line); }
#tooltip.flagged b { color: var(--flag-ink); }
/* Every tooltip has an arrow that points at its code: above it, or below it with .up */
#tooltip::before, #tooltip::after { content: ""; position: absolute; left: var(--arrow-x, 18px); border: 7px solid transparent; transform: translateX(-50%); }
#tooltip::before { bottom: 100%; border-bottom-color: var(--flag-line); }
#tooltip::after { bottom: calc(100% - 1.5px); border-bottom-color: var(--flag-bg); }
#tooltip.up::before { bottom: auto; top: 100%; border-bottom-color: transparent; border-top-color: var(--flag-line); }
#tooltip.up::after { bottom: auto; top: calc(100% - 1.5px); border-bottom-color: transparent; border-top-color: var(--flag-bg); }
</style>

      plans.before.push({ cap: cap, newFile: newFile, rows: d.rows.map(function (r) { return { line: r.l, mark: !faded && r.changed && r.l != null && isCode(la[r.l]) ? 'del' : '' }; }) });
      plans.after.push({ cap: cap, newFile: newFile, rows: d.rows.map(function (r) { return { line: r.r, mark: !faded && r.changed && r.r != null && isCode(lb[r.r]) ? 'add' : '' }; }) });
    }
    return plans;
  }
  // Changed words, as in a split diff: equal lines (whitespace ignored) anchor the two panes, and the words
  // of each block of changed lines between anchors are compared, so a line that was only rewrapped stays
  // unmarked and a line that changed in one word shows that word. Names weigh more than punctuation, so a
  // shared ")" never pulls names out of line. Every line of a changed block gets the line color; a line
  // where most names changed, and a block that shares too little, get no word marks.
  var TOK = /[\w$]+|[^\s\w$\uE000]/g;
  function tokenize(lines, ids) {
    var out = [];
    ids.forEach(function (li) {
      var m; TOK.lastIndex = 0;
      while ((m = TOK.exec(lines[li]))) out.push({ li: li, s: m.index, e: m.index + m[0].length, t: m[0] });
    });
    return out;
  }
  function tokWeight(t) { return /[\w$]/.test(t) ? 4 : 1; }
  function isName(x) { return tokWeight(x.t) > 1; }
  function blockMarks(a, b, la, lb, out) {
    var A = tokenize(a, la), B = tokenize(b, lb), n = A.length, m = B.length, i, j, dp = [];
    var whole = !n || !m || n * m > 400000;
    if (!whole) {
      for (i = n; i >= 0; i--) {
        dp[i] = new Int32Array(m + 1);
        for (j = m - 1; i < n && j >= 0; j--) {
          dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1], A[i].t === B[j].t ? dp[i + 1][j + 1] + tokWeight(A[i].t) : 0);
        }
      }
      i = 0; j = 0;
      while (i < n && j < m) {
        if (A[i].t === B[j].t && dp[i][j] === dp[i + 1][j + 1] + tokWeight(A[i].t)) { A[i].keep = B[j].keep = true; i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
        else j++;
      }
      var names = Math.max(A.filter(isName).length, B.filter(isName).length);
      whole = !names || A.filter(function (x) { return x.keep && isName(x); }).length / names < 0.3;
    }
    [[a, la, A, out.before], [b, lb, B, out.after]].forEach(function (s) {
      s[1].forEach(function (li) {
        if (!/[^\s\uE000]/.test(s[0][li])) return; // blank line or "..."
        var toks = s[2].filter(function (x) { return x.li === li; }), gone = toks.filter(function (x) { return !x.keep; });
        var ns = toks.filter(isName), goneNs = gone.filter(isName);
        if (whole || !ns.length || goneNs.length * 2 > ns.length) { s[3][li] = { ranges: [] }; return; }
        var ranges = [];
        gone.forEach(function (x) {
          var last = ranges[ranges.length - 1];
          // Neighbouring changed tokens with only spaces between them form one mark
          if (last && /^\s*$/.test(s[0][li].slice(last[1], x.s))) last[1] = x.e;
          else ranges.push([x.s, x.e]);
        });
        s[3][li] = { ranges: ranges };
      });
    });
  }
  function wordMarks(a, b) {
    var out = { before: [], after: [] }, la = [], lb = [];
    function flush() { if (la.length || lb.length) blockMarks(a, b, la, lb, out); la = []; lb = []; }
    diffRows(a, b).rows.forEach(function (r) {
      if (!r.changed) { flush(); return; }
      if (r.l != null) la.push(r.l);
      if (r.r != null) lb.push(r.r);
    });
    flush();
    return out;
  }
  // Wraps character ranges of a rendered line in .chg spans, across its highlight and tip spans
  function wrapRanges(node, ranges) {
    if (!ranges.length) return;
    var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT), texts = [], tn, pos = 0;
    while ((tn = walker.nextNode())) texts.push(tn);
    texts.forEach(function (t) {
      var s0 = pos, e0 = pos + t.data.length, cuts = [];
      pos = e0;
      ranges.forEach(function (r) { var s = Math.max(r[0], s0), e = Math.min(r[1], e0); if (s < e) cuts.push([s - s0, e - s0]); });
      if (!cuts.length) return;
      var frag = document.createDocumentFragment(), last = 0;
      cuts.forEach(function (c) {
        if (c[0] > last) frag.appendChild(document.createTextNode(t.data.slice(last, c[0])));
        frag.appendChild(el('span', 'chg', t.data.slice(c[0], c[1])));
        last = c[1];
      });
      if (last < t.data.length) frag.appendChild(document.createTextNode(t.data.slice(last)));
      t.parentNode.replaceChild(frag, t);
    });
  }
  // A long line may wrap after "(", "," or "." and before an operator, never inside a name. <wbr> adds no
  // characters, so copied code stays the same
  function breakLines(node) {
    var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT), texts = [], tn;
    while ((tn = walker.nextNode())) texts.push(tn);
    texts.forEach(function (t) {
      var parts = t.data.split(/(?<=[(,.[{])(?=\S)/);
      // A text node can end at "(": the next name is often a highlight span of its own
      var tail = /[(,.[{]$/.test(t.data);
      if (parts.length < 2 && !tail) return;
      var frag = document.createDocumentFragment();
      parts.forEach(function (x, i) { if (i) frag.appendChild(document.createElement('wbr')); frag.appendChild(document.createTextNode(x)); });
      if (tail) frag.appendChild(document.createElement('wbr'));
      t.parentNode.replaceChild(frag, t);
    });
  }
  // The lines of a pane as the page shows them: member gaps added, indent removed, "..." marked
  function paneLines(chunks) {
    var all = [];
    chunks.forEach(function (c) {
      withMemberGaps(textLines(c.code)).forEach(function (t) { all.push(markGaps(t.slice(t.match(/^\s*/)[0].length))); });
    });
    return all;
  }
  // Each chunk names its file, unless the chunk before it in the same pane is from the same file
  function markFiles(chunks) {
    chunks.forEach(function (c, k) { c.showFile = !!c.file && (k === 0 || chunks[k - 1].file !== c.file); });
  }

  // Paired rows of aligned chunks get the same height, so a line that wraps on one side keeps the rows level.
  function syncRows(body) {
    var after = {}, pairs = [];
    body.querySelectorAll('.side.after [data-row]').forEach(function (d) { d.style.minHeight = ''; after[d.dataset.row] = d; });
    body.querySelectorAll('.side.before [data-row]').forEach(function (d) {
      d.style.minHeight = '';
      if (after[d.dataset.row]) pairs.push([d, after[d.dataset.row]]);
    });
    pairs.map(function (p) { return Math.max(p[0].offsetHeight, p[1].offsetHeight); }).forEach(function (h, i) {
      pairs[i][0].style.minHeight = pairs[i][1].style.minHeight = h + 'px';
    });
  }

  var tipTexts = [];
  var NOTE = /^((?:Suspected bug|Unexplained)(?:\s*\([^)]*\))?):\s*([\s\S]*)$/;
  // A side without code is left out, and the other side takes the full width. Unchanged context goes
  // into a neutral pane of its own below the changed code, so it is never boxed inside a colored pane;
  // so does code repeated from an earlier slide (recap), which supports the change rather than being it.
  // marks: the word marks of the pane's lines (from wordMarks), or null to use the row marks of plans
  // label: the heading of a step pane (the method of the step), or the corner tag of a code pane
  function sideEl(cls, label, chunks, tips, plans, marks) {
    if (!chunks.length) return {};
    var raw = Object.keys(tips || {}), base = tipTexts.length;
    raw.forEach(function (k) { tipTexts.push(tips[k]); });
    var all = paneLines(chunks), markCls = cls === 'before' ? 'del' : 'add';
    var targets = tipTargets(all, raw), lineNo = 0;
    var main = null, ctx = null;
    chunks.forEach(function (c, k) {
      var plan = plans && plans[k];
      var side;
      if (c.context || c.recap === true) {
        if (!ctx) { ctx = el('div', 'side ctx ' + cls); ctx.appendChild(el('div', 'label', 'Context')); }
        side = ctx;
      } else {
        if (!main) { main = el('div', 'side ' + cls); if (label != null) main.appendChild(el('div', 'label', label)); }
        side = main;
      }
      // A chunk that starts another file below an earlier chunk gets more space above it
      var newFile = (plan ? plan.newFile : c.showFile) && !!side.querySelector('.chunk');
      var node = el('div', 'chunk' + (c.recap ? ' recap' : '') + (newFile ? ' new-file' : ''));
      if (c.caption || c.recap || c.showFile || (plan && plan.cap)) {
        var cap = el('div', 'cap', c.caption || (c.showFile ? null : '\u00a0'));
        if (c.showFile) { var f = el('span', 'file', c.file); f.title = c.file; cap.insertBefore(f, cap.firstChild); }
        if (c.recap) cap.appendChild(el('span', 'tag', c.recap === 'above' ? 'from above' : 'shown earlier'));
        if (plan) cap.dataset.row = k + ':cap';
        node.appendChild(cap);
      }
      var src = withMemberGaps(textLines(c.code)), start = lineNo, ci = 0;
      var urls = src.map(function (t) { return t.trim() && c.links ? c.links[ci++] : null; });
      lineNo += src.length;
      var rows = plan ? plan.rows : src.map(function (t, i) { return { line: i, mark: '' }; });
      var lines = el('div', 'lines');
      rows.forEach(function (r, ri) {
        var d;
        if (r.line == null) {
          d = el('div', 'ln pad');
        } else {
          var t = src[r.line], li = start + r.line, wm = marks && marks[li];
          var mark = marks ? (wm ? markCls : '') : r.mark;
          d = el('div', 'ln' + (t.trim() ? '' : ' blank') + (mark ? ' ' + mark : ''));
          d.style.paddingLeft = (t.match(/^\s*/)[0].length + 4) + 'ch';
          d.innerHTML = lineHtml(all[li], targets.filter(function (x) { return x.line === li; }));
          if (wm) wrapRanges(d, wm.ranges);
          breakLines(d);
          if (urls[r.line]) {
            var a = el('a', 'src', '\u2197');
            a.href = urls[r.line]; a.target = '_blank'; a.rel = 'noopener';
            a.title = 'Open on GitHub';
            d.appendChild(a);
          }
        }
        if (plan) d.dataset.row = k + ':' + ri;
        lines.appendChild(d);
      });
      lines.querySelectorAll('.tip').forEach(function (t) {
        t.dataset.tip = base + Number(t.dataset.tip);
        var m = NOTE.exec(tipTexts[t.dataset.tip] || '');
        // A review note is not an explanation: its own mark and color, red for a suspected bug
        if (m) t.classList.add('flag', /^Suspected bug/.test(m[1]) ? 'bug' : 'open-q');
      });
      node.appendChild(lines);
      side.appendChild(node);
    });
    return { main: main, ctx: ctx };
  }

  // Slides: a title slide from the PR, then one slide per concept.
  var deck = document.getElementById('slides');
  var titleSec = el('section', 'slide'), title = el('div', 'title-slide'), meta = el('div', 'meta');
  meta.innerHTML = esc(pr.repo) + ' <a href="' + esc(pr.url) + '" target="_blank" rel="noopener">#' + pr.number + '</a>';
  title.appendChild(meta);
  var h1 = el('h1'); h1.innerHTML = prose(pr.title); title.appendChild(h1);
  if (data.summary) { var sum = el('p', 'lead'); sum.innerHTML = prose(data.summary); title.appendChild(sum); }
  titleSec.appendChild(title);
  deck.appendChild(titleSec);
  // One screen per slide, all horizontal. A pane left empty is left out.
  function panes(s) {
    var out = {};
    ['before', 'after'].forEach(function (side) {
      var one = side === 'before' ? 'beforeTips' : 'afterTips';
      out[side] = { chunks: chunkList(s[side]), tips: Object.assign({}, s.tips, s[one]) };
      // Step code is old code, so it takes the tips of the Before side
      if (side === 'before' && s.steps) out[side].tips = Object.assign({}, s.tips, s.beforeTips);
    });
    return out;
  }
  // A step list shows what happens in order: a number, one sentence and the few lines of code that do it,
  // with an arrow to the next step. It shows a bug as it runs, which side-by-side panes cannot.
  function stepsEl(s, p) {
    var list = el('div', 'steps');
    s.steps.forEach(function (step, i) {
      if (i) list.appendChild(el('div', 'step-arrow', '\u2193'));
      var row = el('div', 'step-row'), content = el('div', 'step-content');
      row.appendChild(el('div', 'step-num', String(i + 1)));
      var t = el('div', 'step-text'); t.innerHTML = prose(step.text); content.appendChild(t);
      var code = sideEl('step', step.where || '', [{ code: step.code, links: step.links }], p.before.tips, null).main;
      if (code) content.appendChild(code);
      row.appendChild(content);
      list.appendChild(row);
    });
    return list;
  }
  function conceptSection(s, p) {
    var sec = el('section', 'slide'), body = el('div', 'concept');
    sec.appendChild(body);
    var head = el('div', 'head');
    var h2 = el('h2'); h2.innerHTML = prose(s.title); head.appendChild(h2);
    body.appendChild(head);
    var text = s.text;
    if (text) { var lead = el('p', 'lead'); lead.innerHTML = prose(text); body.appendChild(lead); }
    if (s.steps) { body.appendChild(stepsEl(s, p)); return sec; }
    var sides = el('div', 'sides');
    // Changed code on top, old left and new right; all context of the slide below it, across both columns,
    // the same code shown once. Context never takes a column, so a side with only context leaves the
    // changed code of the other side at the full width.
    function changed(chunks) { return chunks.filter(function (c) { return !c.context && c.recap !== true; }); }
    var bc = changed(p.before.chunks), ac = changed(p.after.chunks), seen = {};
    var ctx = p.before.chunks.concat(p.after.chunks).filter(function (c) {
      if (bc.indexOf(c) >= 0 || ac.indexOf(c) >= 0) return false;
      var key = (c.file || '') + '\n' + c.code.trim();
      return seen[key] ? false : (seen[key] = true);
    });
    [bc, ac, ctx].forEach(markFiles);
    var plans = alignPanes(bc, ac, s.align !== false);
    var marks = bc.length && ac.length && s.align !== false ? wordMarks(paneLines(bc), paneLines(ac)) : null;
    var cols = [sideEl('before', 'Before', bc, p.before.tips, plans.before, marks && marks.before).main,
                sideEl('after', 'After', ac, p.after.tips, plans.after, marks && marks.after).main]
      .filter(Boolean);
    // The context pane takes the tips that have no place in the changed code
    var mainLines = paneLines(bc).concat(paneLines(ac)), ctxTips = {};
    [p.before.tips, p.after.tips].forEach(function (t) {
      Object.keys(t).forEach(function (k) { if (!tipTargets(mainLines, [k]).length) ctxTips[k] = t[k]; });
    });
    var wide = ctx.length ? sideEl('ctx', '', ctx, ctxTips).ctx : null;
    cols.forEach(function (c, i) { c.style.gridColumn = i + 1; c.style.gridRow = 1; sides.appendChild(c); });
    if (wide) { wide.style.gridColumn = '1 / -1'; wide.style.gridRow = cols.length ? 2 : 1; sides.appendChild(wide); }
    if (cols.length < 2) sides.classList.add('single');
    // A slide with no changed code is about its context, so the context gets the normal code size
    if (!cols.length) sides.classList.add('only-ctx');
    body.appendChild(sides);
    return sec;
  }
  slides.forEach(function (s) { deck.appendChild(conceptSection(s, panes(s))); });

  // Closing slide: the open questions as one list, suspected bugs first. Each one names its kind and links to
  // the first slide that holds its tip.
  var KINDS = ['Suspected bug', 'Unexplained'];
  var open = data.open || [];
  if (open.length) {
    var nsec = el('section', 'slide'), nbody = el('div', 'concept'), nhead = el('div', 'head');
    nhead.appendChild(el('h2', null, 'Review notes'));
    nbody.appendChild(nhead);
    var notes = el('ol', 'notes');
    KINDS.forEach(function (kind) {
      open.filter(function (o) { return o.kind === kind; }).forEach(function (o) {
        var li = el('li');
        li.innerHTML = '<b>' + esc(kind) + ':</b> ' + prose(o.text);
        if (o.slide && slides[o.slide - 1]) {
          var a = el('a');
          a.innerHTML = prose(slides[o.slide - 1].title) + ' \u2197';
          a.href = '#';
          a.addEventListener('click', function (e) { e.preventDefault(); shower.goTo(o.slide); });
          // A space before the link, so the link wraps to the next line alone, not with the last word
          li.appendChild(document.createTextNode(' '));
          li.appendChild(a);
        }
        notes.appendChild(li);
      });
    });
    nbody.appendChild(notes);
    nsec.appendChild(nbody);
    deck.appendChild(nsec);
  }

  // Tooltips: hover or focus shows the tip; a tap or click keeps it open until the next tap elsewhere.
  var tooltip = el('div'); tooltip.id = 'tooltip'; tooltip.setAttribute('role', 'tooltip'); tooltip.hidden = true;
  document.body.appendChild(tooltip);
  var openTip = null;
  function showTip(t) {
    var text = tipTexts[Number(t.dataset.tip)] || '', m = NOTE.exec(text);
    tooltip.className = m ? 'flagged ' + (/^Suspected bug/.test(m[1]) ? 'bug' : 'open-q') : '';
    tooltip.innerHTML = m ? '<b>' + esc(m[1]) + ':</b> ' + prose(m[2]) : prose(text);
    tooltip.hidden = false;
    var r = t.getBoundingClientRect(), w = tooltip.offsetWidth, h = tooltip.offsetHeight;
    var left = Math.max(16, Math.min(r.left, window.innerWidth - w - 16));
    var top = r.bottom + 14, up = top + h > window.innerHeight - 8;
    if (up) top = Math.max(8, r.top - h - 14);
    tooltip.classList.toggle('up', up);
    // The arrow points at the middle of the code, or near its start when the code is long
    var x = Math.min(r.left + r.width / 2, r.left + 120) - left;
    tooltip.style.setProperty('--arrow-x', Math.max(14, Math.min(x, w - 14)) + 'px');
    tooltip.style.left = left + 'px'; tooltip.style.top = top + 'px';
  }
  function closeTip() { if (openTip) openTip.classList.remove('open'); openTip = null; tooltip.hidden = true; }
  function isTip(n) { return n && n.classList && n.classList.contains('tip'); }
  document.addEventListener('mouseover', function (e) { var t = e.target.closest && e.target.closest('.tip'); if (t) showTip(t); });
  document.addEventListener('mouseout', function (e) { if (e.target.closest && e.target.closest('.tip') && !openTip) tooltip.hidden = true; });
  document.addEventListener('focusin', function (e) { if (isTip(e.target)) showTip(e.target); });
  document.addEventListener('focusout', function (e) { if (isTip(e.target) && !openTip) tooltip.hidden = true; });
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('.tip');
    var same = t && t === openTip;
    closeTip();
    if (t && !same) { openTip = t; t.classList.add('open'); showTip(t); }
  });

  // Long slides: shrink the code font and the review notes in 2px steps until the slide fits its 810px canvas
  // (code not below 12px, notes not below 14px)
  function fitSlides() {
    document.querySelectorAll('.concept').forEach(function (body) {
      var size = 16, note = 20; // --fs-code and --fs-text
      syncRows(body);
      while (body.scrollHeight > body.clientHeight + 1 && (size > 12 || note > 14)) {
        if (size > 12) { size -= 2; body.querySelectorAll('.chunk .lines').forEach(function (l) { l.style.fontSize = size + 'px'; }); }
        if (note > 14) { note -= 2; body.querySelectorAll('.notes').forEach(function (n) { n.style.fontSize = note + 'px'; }); }
        syncRows(body);
      }
    });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSlides); else fitSlides();

  // Shower starts on DOMContentLoaded, after this script; the deck opens in full mode
  document.body.classList.add('shower', 'full');
  var number = document.querySelector('.slide-number');
  function showNumber() { number.textContent = (shower.activeSlideIndex + 1) + ' / ' + shower.slides.length; }
  shower.addEventListener('start', showNumber);
  shower.addEventListener('slidechange', function () { closeTip(); showNumber(); });
  shower.addEventListener('modechange', closeTip);
  // Shower ignores keys on focusable elements, so a focused tip would block the arrow keys
  document.addEventListener('keydown', function (e) {
    if (!isTip(e.target) || e.ctrlKey || e.altKey || e.metaKey) return;
    if (/^(ArrowRight|ArrowDown|PageDown)$/.test(e.key)) { e.preventDefault(); shower.next(); }
    if (/^(ArrowLeft|ArrowUp|PageUp)$/.test(e.key)) { e.preventDefault(); shower.prev(); }
  });
})();
</script>
