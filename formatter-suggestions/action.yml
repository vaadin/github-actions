name: 'Formatter Suggestions'
description: >-
  Reports the result of a formatter workflow on its pull request: posts each
  change the formatter makes as a review suggestion the author can commit from
  the pull request page, keeps one summary comment up to date, and deletes the
  suggestions that later runs no longer make. Meant for a workflow_run
  workflow, so that it covers pull requests from forks without running any of
  their code.

inputs:
  fix-command:
    description: >-
      Command that applies the formatting locally, shown in the summary
      comment, e.g. "mvn spotless:apply".
    required: true
  artifact-name:
    description: >-
      Name of the artifact the formatter workflow uploaded the `git diff` of
      the formatted pull request in.
    required: false
    default: formatter-diff
  diff-file:
    description: Name of the diff file inside the artifact.
    required: false
    default: formatter-diff.txt
  comment-marker:
    description: >-
      Hidden marker that starts the summary comment, so that each run updates
      the one comment instead of adding another.
    required: false
    default: '<!-- formatter-suggestions -->'
  max-suggestions:
    description: >-
      Most suggestions posted in one review. Further changes are counted in
      the summary comment.
    required: false
    default: '12'

runs:
  using: composite
  steps:
    - name: Check the event
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "$EVENT_NAME" != "workflow_run" ]; then
          echo "::error::formatter-suggestions runs from a workflow_run workflow, not $EVENT_NAME"
          exit 1
        fi

    - name: Download formatter diff
      id: download
      # Missing when the formatter run failed before uploading it, which
      # leaves nothing to report
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/formatter-diff
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Report on the pull request
      if: steps.download.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SCRIPT: ${{ github.action_path }}/formatter-suggestions.mjs
        DIFF_FILE: ${{ runner.temp }}/formatter-diff/${{ inputs.diff-file }}
        FIX_COMMAND: ${{ inputs.fix-command }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        MAX_SUGGESTIONS: ${{ inputs.max-suggestions }}
      with:
        script: |
          const { run } = await import(process.env.SCRIPT);
          await run({
            github,
            context,
            core,
            diffFile: process.env.DIFF_FILE,
            fixCommand: process.env.FIX_COMMAND,
            commentMarker: process.env.COMMENT_MARKER,
            maxSuggestions: Number(process.env.MAX_SUGGESTIONS),
          });
