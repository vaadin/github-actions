name: 'Claude Code Review'
description: >-
  Reviews a pull request with Claude Code and posts the findings as a single
  PR review: a prepare step pre-computes the review inputs (diff, metadata,
  merge-base checkout, existing reviews), one read-only Claude Code session
  reviews the changes
  and grades each finding into a value tier, mechanical selection decides
  which findings ship, and a posting step publishes them as inline review
  threads with a summary. In the dismiss-stale-approval mode, it instead
  dismisses its automatic approvals made on an earlier commit of the pull
  request.

inputs:
  mode:
    description: >-
      'review' reviews the pull request. 'dismiss-stale-approval' dismisses
      the approvals of the github-token identity made on a commit other than
      the pull request head, so that an automatic approval does not outlive
      the commit it reviewed; run it on the synchronize event, with the same
      github-token as the review. It needs no checkout and no other input
      than pr-number.
    required: false
    default: 'review'
  anthropic-api-key:
    description: >-
      Anthropic API key. Pass the repository secret, e.g.
      secrets.ANTHROPIC_API_KEY. Required in the review mode.
    required: false
    default: ''
  pr-number:
    description: >-
      Number of the pull request to review, computed by the caller from the
      triggering event (e.g. github.event.issue.number ||
      github.event.pull_request.number).
    required: true
  profile:
    description: >-
      Review profile, which selects the review prompt that ships with this
      action. 'code' reviews framework and library code. 'docs' reviews
      documentation pages and their code examples.
    required: false
    default: 'code'
  github-token:
    description: >-
      Token used to prepare the review inputs and post the review; its
      identity is the review author. Pass a bot token to post under a bot
      identity. Needs read access to the PR and pull-requests write for
      posting.
    required: false
    default: ${{ github.token }}
  reference-repos:
    description: >-
      Optional upstream repositories to provide as read-only context, one per
      line in the form "owner/repo | description". Each repository is shallowly
      cloned, added as an additional working directory, and described to Claude
      in the instructions appended to the system prompt (using the
      description verbatim).
    required: false
    default: ''
  extra-instructions:
    description: >-
      Repository-specific review instructions. They follow the generated
      reference checkout section in the instructions appended to the system
      prompt.
    required: false
    default: ''
  auto-approve:
    description: >-
      Set to 'true' to approve the pull request when the review has no
      findings, its risk is at or below auto-approve-max-risk, and its title
      has one of the auto-approve-types. Needs a profile that rates risk
      ('code'), and a github-token that may approve pull requests. Pair with
      the dismiss-stale-approval mode on the synchronize event, which
      dismisses the approval when new commits are pushed.
    required: false
    default: 'false'
  auto-approve-max-risk:
    description: >-
      The highest risk level that auto-approve accepts: 'low', 'medium' or
      'high'.
    required: false
    default: 'low'
  auto-approve-types:
    description: >-
      The conventional commit types of the pull request title that
      auto-approve accepts, comma- or newline-separated. A title with a scope,
      such as "chore(deps): …", matches its type. A breaking change ("chore!:")
      never matches.
    required: false
    default: 'chore, docs, test'
  upload-execution-log:
    description: >-
      Set to 'true' to upload the full stream-json execution log as a workflow
      artifact. Off by default because the log contains every tool_use with its
      input and every tool_result, and on a public repository the artifact is
      world-readable. Typically wired to a repository variable, e.g.
      vars.CLAUDE_DEBUG.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        HAS_API_KEY: ${{ inputs.anthropic-api-key != '' }}
      run: |
        case "$MODE" in
          review)
            if [ "$HAS_API_KEY" != "true" ]; then
              echo "::error::anthropic-api-key is required in the review mode"
              exit 1
            fi
            ;;
          dismiss-stale-approval) ;;
          *)
            echo "::error::Unknown mode \"$MODE\". Expected review or dismiss-stale-approval."
            exit 1
            ;;
        esac

    - name: Dismiss stale approvals
      if: inputs.mode == 'dismiss-stale-approval'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/dismiss-stale-approval.mjs" "${{ inputs.pr-number }}"

    - name: Prepare review scope
      if: inputs.mode == 'review'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/prepare-review.mjs" "${{ inputs.pr-number }}"

    - name: Prepare Claude run
      id: prepare
      if: inputs.mode == 'review'
      shell: bash
      env:
        REFERENCE_REPOS: ${{ inputs.reference-repos }}
        EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        EXTRA_ADDITIONAL_DIRECTORIES: |
          ${{ runner.temp }}/pr-review
      run: node "$GITHUB_ACTION_PATH/../lib/claude-prepare.mjs"

    - name: Install Claude Code
      if: inputs.mode == 'review'
      shell: bash
      run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.318

    - name: Run Claude Code review
      id: review
      if: inputs.mode == 'review'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        SETTINGS: ${{ steps.prepare.outputs.settings }}
        PROFILE: ${{ inputs.profile }}
        INSTRUCTIONS_FILE: ${{ steps.prepare.outputs.instructions_file }}
      run: node "$GITHUB_ACTION_PATH/run-review.mjs"

    - name: Post review
      if: inputs.mode == 'review'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FINDINGS_FILE: ${{ steps.review.outputs.findings-file }}
        AUTO_APPROVE: ${{ inputs.auto-approve }}
        AUTO_APPROVE_MAX_RISK: ${{ inputs.auto-approve-max-risk }}
        AUTO_APPROVE_TYPES: ${{ inputs.auto-approve-types }}
      run: node "$GITHUB_ACTION_PATH/post-review.mjs" "${{ inputs.pr-number }}"

    - name: Summarize Claude session
      if: always() && steps.review.outputs.execution-file != ''
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../lib/claude-summary.mjs" "${{ steps.review.outputs.execution-file }}"

    - name: Upload findings summary
      if: always() && inputs.mode == 'review'
      uses: actions/upload-artifact@v4
      with:
        name: code-review-findings-pr${{ inputs.pr-number }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/review-output/findings-summary.md
        if-no-files-found: ignore

    - name: Upload Claude execution log
      if: always() && inputs.upload-execution-log == 'true' && steps.review.outputs.execution-file != ''
      uses: actions/upload-artifact@v4
      with:
        name: code-review-execution-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.review.outputs.execution-file }}
        retention-days: 7
